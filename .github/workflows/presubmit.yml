# Required check for this repo. Hand-written until infra-config generates builders for infra repos.
# Runs on every PR and in the merge queue, so it verifies the exact merge result.
name: presubmit
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  presubmit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install --quiet -e ".[test]"
      - run: python -m pytest -q -p no:cacheprovider
      - name: re-running an unchanged action is a reported cache hit (V0-RBE-02)
        run: |
          qqrbe selftest --cache "$RUNNER_TEMP/cache"
          qqrbe selftest --cache "$RUNNER_TEMP/cache" --json | tee "$RUNNER_TEMP/second.json"
          python - "$RUNNER_TEMP/second.json" <<'PY'
          import json, sys
          cache = json.load(open(sys.argv[1]))["details"].get("cache")
          sys.exit(0 if cache == "hit" else f"second run was a cache {cache}, not a hit")
          PY
      - name: a backend that cannot run is a typed, counted fallback (V0-RBE-02)
        # No token is set in this job, so the github backend is unavailable.
        run: |
          qqrbe selftest --backend github --fallback local --no-cache --cache "$RUNNER_TEMP/cache"
          qqrbe stats --cache "$RUNNER_TEMP/cache" | tee "$RUNNER_TEMP/stats.txt"
          grep -q "fallback github->local (backend-unavailable): 1" "$RUNNER_TEMP/stats.txt"
  cross-backend:
    # V0-RBE-01 done-when: the same deterministic action gives the same output digest on the local
    # backend (this job's runner) and the github backend (a second runner, through execute.yml).
    # A PR from another repository gets a token that cannot dispatch here, so it skips this job;
    # the merge queue still runs it.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install --quiet -e .
      - run: qqrbe selftest --backend local --no-cache --json > "$RUNNER_TEMP/local.json"
      - name: selftest on the github backend
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REF: ${{ github.head_ref || github.ref_name }}
        run: >-
          qqrbe selftest --backend github --no-cache --json --option "ref=$REF"
          --option "repository=$GITHUB_REPOSITORY" > "$RUNNER_TEMP/github.json"
      - name: same output digest on both
        run: |
          cat "$RUNNER_TEMP/local.json" "$RUNNER_TEMP/github.json"
          qqrbe compare "$RUNNER_TEMP/local.json" "$RUNNER_TEMP/github.json"
