# The worker of the `github` executor backend (V0-RBE-01): runs one qq-exec-request/1 on a GitHub
# Actions runner and uploads the result as the artifact `qq-result-<request_id>`.
# qqrbe's GitHub backend dispatches it and finds the run by its run-name. Anyone who can dispatch
# workflows here (write access) can run a command on this runner, as with any CI job.
name: execute
run-name: qq-exec ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Unique id the client uses to find this run and its artifact.
        required: true
        type: string
      request:
        description: The qq-exec-request/1 JSON.
        required: true
        type: string
permissions:
  contents: read
jobs:
  execute:
    # TODO(expert): pick the runner from the action's platform properties; v0 has one platform.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: check request id
        id: check
        env:
          REQUEST_ID: ${{ inputs.request_id }}
        run: '[[ "$REQUEST_ID" =~ ^[A-Za-z0-9_-]{1,64}$ ]] || { echo "bad request_id"; exit 1; }'
      - uses: actions/checkout@v7
        with:
          path: .qq/worker
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: python -m pip install --quiet ./.qq/worker
      - name: write request
        env:
          REQUEST: ${{ inputs.request }}
        run: printf '%s' "$REQUEST" > "$RUNNER_TEMP/request.json"
      - name: read source
        id: source
        run: qqrbe worker-source --request "$RUNNER_TEMP/request.json" --out "$RUNNER_TEMP/result" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ steps.source.outputs.commit }}
          path: .qq/src
          persist-credentials: false
      - name: run action
        run: qqrbe worker --request "$RUNNER_TEMP/request.json" --repo .qq/src --out "$RUNNER_TEMP/result"
      - uses: actions/upload-artifact@v7
        if: always() && steps.check.outcome == 'success'
        with:
          name: qq-result-${{ inputs.request_id }}
          path: ${{ runner.temp }}/result
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore
